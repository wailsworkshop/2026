<body>



<div class="cfp-page">
  <div class="cfp-hero">
    <div class="s-eyebrow">Attend</div>
    <h1>Travel <em>Information</em></h1>
    <p>Practical information on how to get to Paris and the workshop venue.</p>
  </div>
  <div class="cfp-body">
      <h2>Paris</h2>
      <div style="position:relative; padding-bottom:56.25%; height:0; overflow:hidden; border-radius:4px; margin-bottom:1rem;">
          <iframe id="paris-video"
                  src="https://www.youtube-nocookie.com/embed/YPMOce2VdKQ?playlist=YPMOce2VdKQ&autoplay=1&loop=1&mute=1"
                  style="position:absolute; top:0; left:0; width:100%; height:100%; border:0;"
                  allow="autoplay; encrypted-media"
                  allowfullscreen
                  title="Paris">
          </iframe>
          <div style="position:absolute; top:0; left:0; right:0; height:55px; background:white;"></div>
          <div style="position:absolute; bottom:0; left:0; right:0; height:55px; background:white;"></div>
      </div>
      <button onclick="toggleMute()" id="mute-btn" class="btn btn-ghost" style="margin-bottom:2rem;">🔇 Enable audio</button>

      <script>
          var muted = true;
          function toggleMute() {
              var iframe = document.getElementById('paris-video');
              var btn = document.getElementById('mute-btn');
              muted = !muted;
              var muteParam = muted ? '&mute=1' : '&mute=0';
              iframe.src = iframe.src.replace(/&mute=[01]/, muteParam);
              btn.textContent = muted ? 'Enable audio' : 'Disable audio';
          }
      </script>

  </div>
